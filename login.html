<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Masuk ke dashboard ShoopyMail.">
  <title>ShoopyMail - Masuk</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <main class="mx-auto flex min-h-screen max-w-md flex-col justify-center px-5 py-12">
    <a href="index.html" class="mb-8 text-center text-2xl font-extrabold tracking-tight text-slate-900">
      Shoopy<span class="text-blue-800">Mail</span>
    </a>
    <section class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
      <h1 class="text-xl font-bold">Masuk ke akun</h1>
      <p class="mt-2 text-sm text-slate-600">Gunakan email dan password akun ShoopyMail.</p>
      <form id="login-form" class="mt-6 space-y-4">
        <label class="block text-sm font-medium" for="email">
          Email
          <input id="email" name="email" type="email" autocomplete="username" required
            class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2.5 text-base focus:border-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-100">
        </label>
        <label class="block text-sm font-medium" for="password">
          Password
          <input id="password" name="password" type="password" autocomplete="current-password" required
            class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2.5 text-base focus:border-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-100">
        </label>
        <p id="login-message" class="hidden rounded-md bg-red-50 px-3 py-2 text-sm text-red-800" role="alert"></p>
        <button id="login-button" type="submit"
          class="w-full rounded-md bg-slate-800 px-4 py-2.5 font-bold text-white transition hover:bg-slate-900 disabled:cursor-not-allowed disabled:opacity-60">
          Masuk
        </button>
      </form>
      <p class="mt-5 text-center text-sm text-slate-600">
        Belum punya akun? <a href="daftar.html" class="font-semibold text-blue-800 hover:underline">Daftar</a>
      </p>
    </section>
    <p class="mt-6 text-center text-xs text-slate-500"><a href="index.html" class="hover:underline">Kembali ke beranda</a></p>
  </main>
  <script>
    const ADMIN_USER_ID = '392d1ab1-46fd-406a-b555-681b068c2374';
    const form = document.getElementById('login-form');
    const button = document.getElementById('login-button');
    const message = document.getElementById('login-message');

    function showLoginError(text) {
      message.textContent = text;
      message.classList.remove('hidden');
    }

    async function initializeLogin() {
      const response = await fetch('/dashboard.html', { cache: 'no-store' });
      if (!response.ok) throw new Error('Konfigurasi login tidak dapat dimuat.');
      const source = await response.text();
      const url = source.match(/const SUPABASE_URL = '([^']+)'/);
      const key = source.match(/const SUPABASE_ANON_KEY = '([^']+)'/);
      if (!url || !key || !window.supabase?.createClient) {
        throw new Error('Konfigurasi Supabase login belum tersedia.');
      }

      window.supabaseClient = window.supabase.createClient(url[1], key[1]);
      const { data, error } = await window.supabaseClient.auth.getSession();
      if (error) throw error;
      if (data.session?.user) {
        window.location.replace(data.session.user.id === ADMIN_USER_ID ? 'admin.html' : 'dashboard.html');
      }
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = 'Memproses...';
      message.classList.add('hidden');
      try {
        if (!window.supabaseClient) throw new Error('Layanan login belum siap. Muat ulang halaman.');
        const { data, error } = await window.supabaseClient.auth.signInWithPassword({
          email: form.email.value.trim(),
          password: form.password.value
        });
        if (error) throw error;
        window.location.replace(data.user.id === ADMIN_USER_ID ? 'admin.html' : 'dashboard.html');
      } catch (error) {
        showLoginError(error.message || 'Login gagal. Periksa email dan password.');
        button.disabled = false;
        button.textContent = 'Masuk';
      }
    });

    initializeLogin().catch(error => {
      console.error('[login] Initialization failed:', error);
      showLoginError(error.message || 'Layanan login gagal dimuat.');
    });
  </script>
</body>
</html>
